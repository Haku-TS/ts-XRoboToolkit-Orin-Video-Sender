[workspace]
authors = ["Liuchuan Yu <lyu20@gmu.edu>"]
channels = ["conda-forge"]
name = "XRoboToolkit-Orin-Video-Sender"
platforms = ["linux-64", "linux-aarch64"]
version = "0.1.0"

[tasks]
build = "make"
clean = "make clean"
debug = "make debug"

[dependencies]
gstreamer = ">=1.22"
gst-plugins-base = ">=1.22"
glib = ">=2.0"
pkg-config = ">=0.29"
gxx = ">=11"
make = ">=4.3"
